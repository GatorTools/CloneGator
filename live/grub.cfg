# Menu de démarrage du live, commun au BIOS et à l'UEFI (§15). Masqué : la
# machine démarre directement CloneGator, en anglais avec un clavier US ; la
# langue et le clavier se changent ensuite dans CloneGator (F2, F3). Échap,
# pendant les deux secondes d'attente, montre ce menu, pour le dépannage.
set default=0
set timeout_style=hidden
set timeout=2

# Une police pour les accents du menu ; sans elle, on reste en mode texte.
if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod all_video
    insmod gfxterm
    set gfxmode=auto
    terminal_output gfxterm
fi

menuentry "CloneGator" {
    linux /live/vmlinuz boot=live quiet
    initrd /live/initrd.img
}
